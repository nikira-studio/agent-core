name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Docker image ships (see Dockerfile), so it is the
        # version that must pass. 3.12 runs alongside it as forward-compatibility
        # signal; drop it if the extra CI time stops being worth it.
        python-version: ["3.11", "3.12"]
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
